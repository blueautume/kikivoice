# One trusted hostname, one public TLS port. HTTP/WebSocket and TURN/STUN
# are distinguished only after TLS decryption; no new DNS record is needed.
global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 1024
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend livekit_lab_tls
    # HTTP/1.1 is deliberate: req.proto_http inspects HTTP/1.x and WebSockets.
    bind :443 ssl crt /etc/haproxy/private/furby.top.pem alpn http/1.1
    tcp-request inspect-delay 3s
    acl is_http req.proto_http
    acl is_stun req.payload(4,4) -m bin 2112a442
    tcp-request content accept if is_http
    tcp-request content accept if is_stun
    tcp-request content reject if WAIT_END
    use_backend lab_turn if is_stun
    default_backend lab_http

backend lab_http
    server nginx 127.0.0.1:8443 send-proxy-v2

backend lab_turn
    # LiveKit authenticates TURN allocations with its own short-lived credentials.
    server livekit 127.0.0.1:5349 send-proxy-v2

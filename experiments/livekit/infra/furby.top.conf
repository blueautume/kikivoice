# Independent LiveKit experiment: business API and WebRTC signaling share TLS.
server {
    listen 80;
    listen [::]:80;
    server_name furby.top www.furby.top;
    return 308 https://furby.top$request_uri;
}

server {
    # HAProxy owns public TLS :443 and sends trusted PROXY v2 on loopback.
    listen 127.0.0.1:8443 proxy_protocol;
    server_name furby.top www.furby.top;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_tokens off;
    client_max_body_size 2m;
    # Newer SDKs include their initial SDP in the v1 query string.
    large_client_header_buffers 4 128k;

    add_header X-Content-Type-Options nosniff always;

    location = /health {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host furby.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host furby.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        access_log off;
    }

    # Separate read-only management authentication; never proxy the SFU admin API.
    location /admin/v1/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host furby.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        access_log off;
    }

    # Only the account host can exchange or revoke account-bound voice leases.
    # The API additionally requires signed, short-lived, replay-protected requests.
    location /internal/v1/account/ {
        allow 43.138.219.160;
        deny all;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host furby.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        access_log off;
    }

    location = / {
        default_type text/plain;
        return 200 'furby.top: independent LiveKit voice experiment.\n';
    }

    location / {
        return 404;
    }

    # Operations identity and ACL live only on the account server.
    location = /internal/admin/v2/dashboard {
        allow 43.138.219.160;
        deny all;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host furby.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        access_log off;
    }

    # All SDK signalling paths go through the revocable session/permission gateway.
    # Covers /rtc, /rtc/v1 and both /validate endpoints. Never expose :7880.
    location /rtc {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host furby.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # WebSocket URLs may include short-lived participant tokens.
        access_log off;
        # Upstream error logs otherwise include the original request query/SDP.
        error_log /dev/null;
    }

    # Administrative LiveKit APIs are available only to the local backend.
    location /twirp/ {
        return 404;
    }
}

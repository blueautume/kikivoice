# Unknown hosts and direct-IP connections do not expose the business API.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name kiki.group www.kiki.group;
    return 308 https://kiki.group$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kiki.group;
    ssl_certificate /etc/nginx/tls/kiki.group/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/kiki.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://kiki.group$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiki.group;
    ssl_certificate /etc/nginx/tls/kiki.group/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/kiki.group/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_session_cache shared:KikiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/kikitalk/current;
    index index.html;
    access_log off;
    autoindex off;
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Nginx is the sole public proxy. Overwrite, rather than append, untrusted XFF.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host kiki.group;
    proxy_set_header X-Forwarded-Host kiki.group;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_redirect off;

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /v1/me/avatar {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8000;
    }
    # Social pictures are authenticated API responses, never a static alias.
    location = /v1/social/media {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8000;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
    }
    # Account operations has its own viewer credential and no public access log.
    location /admin/v1/ {
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8000;
    }
    location /admin/v2/ {
        client_max_body_size 32k;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8000;
    }
    # Native Passkeys: exact location takes precedence over hidden-file denial.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        expires 5m;
        try_files $uri =404;
    }
    location ~ /\. {
        return 404;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

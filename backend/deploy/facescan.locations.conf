# FaceScan has an independent release directory, outside the KikiTalk website.
location = /facescan {
    return 308 /facescan/;
}

location /facescan/ {
    alias /var/www/facescan/current/;
    index support.html;
    charset utf-8;
    expires -1;

    # Location-level add_header replaces inheritance; retain the shared headers.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only the two supplied style blocks and the embedded support image are allowed.
    add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-jP5PlUqurRcWZ4hWPthbHCzVVTMMVSx5QcntZSUSXhw=' 'sha256-SiiHH7Ayzqw865HUBnlsWwgYbunkOWQxxP+2W9Z0N5Y='; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
